<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- VPC -->
  <rect x="50" y="30" width="1100" height="740" fill="none" stroke="#000000" stroke-width="3"/>
  <text x="60" y="55" font-family="Arial" font-size="24" fill="#000">VPC</text>

  <!-- Public Subnet -->
  <rect x="100" y="80" width="1000" height="250" fill="none" stroke="#1E90FF" stroke-width="2"/>
  <text x="110" y="105" font-family="Arial" font-size="20" fill="#1E90FF">Public Subnet</text>

  <!-- Private Subnet -->
  <rect x="100" y="380" width="1000" height="350" fill="none" stroke="#32CD32" stroke-width="2"/>
  <text x="110" y="405" font-family="Arial" font-size="20" fill="#32CD32">Private Subnet</text>

  <!-- EC2 Instances -->
  <!-- Controller -->
  <rect x="150" y="130" width="150" height="80" fill="#D3D3D3" stroke="#000"/>
  <text x="155" y="165" font-family="Arial" font-size="14" fill="#000">Ansible Controller</text>
  <!-- Public Target 1 -->
  <rect x="350" y="130" width="150" height="80" fill="#D3D3D3" stroke="#000"/>
  <text x="355" y="165" font-family="Arial" font-size="14" fill="#000">Public Target 1</text>
  <!-- Public Target 2 -->
  <rect x="550" y="130" width="150" height="80" fill="#D3D3D3" stroke="#000"/>
  <text x="555" y="165" font-family="Arial" font-size="14" fill="#000">Public Target 2</text>
  <!-- Private Target -->
  <rect x="350" y="480" width="150" height="80" fill="#D3D3D3" stroke="#000"/>
  <text x="355" y="515" font-family="Arial" font-size="14" fill="#000">Private Target</text>

  <!-- NAT Gateway -->
  <rect x="800" y="480" width="120" height="60" fill="#FFD700" stroke="#000"/>
  <text x="805" y="515" font-family="Arial" font-size="14" fill="#000">NAT Gateway</text>

  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="red"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="purple"/>
    </marker>
  </defs>

  <!-- SSH arrows (red) -->
  <line x1="300" y1="170" x2="350" y2="170" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="165" font-family="Arial" font-size="12" fill="red">SSH</text>
  <line x1="300" y1="170" x2="550" y2="170" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="210" x2="425" y2="520" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="330" y="380" font-family="Arial" font-size="12" fill="red">SSH</text>

  <!-- Outbound arrow (purple) -->
  <line x1="500" y1="560" x2="800" y2="560" stroke="purple" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  <text x="620" y="555" font-family="Arial" font-size="12" fill="purple">Outbound internet traffic</text>
</svg>
